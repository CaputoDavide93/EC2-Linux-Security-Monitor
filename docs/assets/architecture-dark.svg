1.5" marker-end="url(#a)"/><text x="812.0" y="445.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">stdin, if infected</text><polyline points="744,602 880,602" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="812.0" y="593.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">write, --move</text><polyline points="880,652 732,652" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="806.0" y="669.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">status.json</text><polyline points="300,626.0 448,626.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="374.0" y="617.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">status</text><polyline points="590.0,220 590.0,172" fill="none" stroke="#6b7684" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><polyline points="590.0,344 590.0,392" fill="none" stroke="#6b7684" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="602.0" y="200.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="start">sourced by</text><text x="602.0" y="372.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="start">sourced by</text><line x1="24" y1="748" x2="1156" y2="748" stroke="#232a33" stroke-width="1"/><text x="24.0" y="774.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">Every schedule and path is set once, in the config file both scripts source. The health check repairs what the scan depends on.</text></svg>