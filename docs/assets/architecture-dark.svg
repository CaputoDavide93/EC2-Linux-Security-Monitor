<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" width="1180" height="700" role="img" aria-label="The scan timer runs security-monitor, which refreshes definitions, applies updates, scans with clamscan and writes status.json; infected files are quarantined and alerted on, and the status dashboard reads the result. The health timer runs security-manager, which repairs services, definitions and timers. Both scripts source one config file."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6b7684"/></marker></defs><rect x="24" y="40" width="228" height="586" rx="14" fill="#11151b" stroke="#30363d" stroke-width="1" stroke-dasharray="6 5"/><text x="42.0" y="64.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa4b0" text-anchor="start" font-weight="600">SYSTEMD TIMERS</text><rect x="44" y="88" width="188" height="92" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(60.0,101.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M12 7v5l3 2"/></g><text x="91.0" y="116.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Scan timer</text><text x="60.0" y="140.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#9aa4b0" text-anchor="start">SCAN_SCHEDULE</text><text x="60.0" y="158.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">02:00 daily</text><rect x="44" y="514" width="188" height="92" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(60.0,527.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M12 7v5l3 2"/></g><text x="91.0" y="542.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Health timer</text><text x="60.0" y="566.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#9aa4b0" text-anchor="start">HEALTH_SCHEDULE</text><text x="60.0" y="584.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">every 6 hours</text><text x="138.0" y="336.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">Persistent=true</text><text x="138.0" y="356.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa4b0" text-anchor="middle">a run missed while the</text><text x="138.0" y="373.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa4b0" text-anchor="middle">instance was stopped</text><text x="138.0" y="390.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa4b0" text-anchor="middle">happens on next boot</text><rect x="288" y="88" width="220" height="92" rx="10" fill="#4c7ef3" stroke="#4c7ef3" stroke-width="1"/><g transform="translate(304.0,101.0) scale(0.8750)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z M8.5 12l2.5 2.5 4.5-4.5"/></g><text x="335.0" y="116.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#ffffff" text-anchor="start" font-weight="600">security-monitor</text><text x="304.0" y="140.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#ffffff" text-anchor="start" opacity="0.85">scan [quick|full]</text><text x="304.0" y="158.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">as root</text><rect x="288" y="315" width="220" height="64" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(304.0,328.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9 M17 6h3 M15 4v4 M4 12h3 M11 12h9 M9 10v4 M4 18h11 M19 18h1 M17 16v4"/></g><text x="335.0" y="343.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Config file</text><text x="304.0" y="367.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#9aa4b0" text-anchor="start">security-monitor.conf</text><rect x="288" y="514" width="220" height="92" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(304.0,527.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 1 5-1.5l-2.6 2.6.5 2 2 .5 2.6-2.6a4 4 0 0 1-5.4 5.1L10 19.2a2 2 0 0 1-2.8-2.8l6.8-6.8a4 4 0 0 1 .7-3.3z"/></g><text x="335.0" y="542.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">security-manager</text><text x="304.0" y="566.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#9aa4b0" text-anchor="start">health</text><text x="304.0" y="584.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">as root</text><rect x="556" y="102" width="240" height="64" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(572.0,115.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12 M7 10l5 5 5-5 M4 20h16"/></g><text x="603.0" y="130.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Refresh definitions</text><text x="572.0" y="154.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#9aa4b0" text-anchor="start">freshclam</text><rect x="556" y="202" width="240" height="64" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(572.0,215.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8 M4 3v5h5 M4 13a8 8 0 0 0 14.3 4.9L20 16 M20 21v-5h-5"/></g><text x="603.0" y="230.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Apply updates</text><text x="572.0" y="254.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#9aa4b0" text-anchor="start">apt-get / dnf upgrade</text><rect x="556" y="302" width="240" height="64" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(572.0,315.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7a3 3 0 0 1 6 0 M7 9h10v5a5 5 0 0 1-10 0z M12 9v10 M3 12h4 M17 12h4 M4 7l3 2.5 M20 7l-3 2.5 M4 19l3-2.5 M20 19l-3-2.5"/></g><text x="603.0" y="330.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Scan for malware</text><text x="572.0" y="354.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#9aa4b0" text-anchor="start">clamscan -r -i</text><rect x="556" y="402" width="240" height="64" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(572.0,415.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z M14 3v4h4 M9 12h6 M9 16h6"/></g><text x="603.0" y="430.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Write the result</text><text x="572.0" y="454.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#9aa4b0" text-anchor="start">status.json</text><rect x="876" y="202" width="280" height="64" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(892.0,215.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11h14v10H5z M8 11V7a4 4 0 0 1 8 0v4 M12 15v2"/></g><text x="923.0" y="230.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Quarantine</text><text x="892.0" y="254.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#9aa4b0" text-anchor="start">QUARANTINE_DIR, mode 0700</text><rect x="876" y="302" width="280" height="64" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(892.0,315.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z M10 21h4"/></g><text x="923.0" y="330.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Alert</text><text x="892.0" y="354.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#9aa4b0" text-anchor="start">ALERT_COMMAND</text><rect x="876" y="402" width="280" height="64" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(892.0,415.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16h16 M8 16v-4 M12 16V8 M16 16v-6"/></g><text x="923.0" y="430.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Status dashboard</text><text x="892.0" y="454.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#9aa4b0" text-anchor="start">security-monitor status</text><rect x="556" y="514" width="600" height="92" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(572.0,527.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 4 10 2-5h6"/></g><text x="603.0" y="542.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Health checks</text><text x="572.0" y="566.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">restarts dead services and re-downloads stale definitions,</text><text x="572.0" y="584.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">re-enables stopped timers, checks the installed scripts and config</text><polyline points="240,134.0 280,134.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><polyline points="240,560.0 280,560.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><polyline points="516,134.0 548,134.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><polyline points="516,560.0 548,560.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><polyline points="676.0,174 676.0,194" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><polyline points="676.0,274 676.0,294" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><polyline points="676.0,374 676.0,394" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><polyline points="804,318 868,246" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="850.0" y="292.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="start">--move</text><polyline points="804,340.0 868,340.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="836.0" y="331.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#aeb7c2" text-anchor="middle">infected</text><polyline points="804,434.0 868,434.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="836.0" y="425.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#aeb7c2" text-anchor="middle">read by</text><polyline points="398.0,307 398.0,188" fill="none" stroke="#6b7684" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><polyline points="398.0,387 398.0,506" fill="none" stroke="#6b7684" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="408.0" y="251.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#aeb7c2" text-anchor="start">sourced by</text><text x="408.0" y="450.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#aeb7c2" text-anchor="start">sourced by</text><line x1="24" y1="648" x2="1156" y2="648" stroke="#232a33" stroke-width="1"/><text x="24.0" y="674.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">A schedule or a path is stated once, in the config file. The health check repairs what the scan depends on, so a stopped timer or a stale database does not go unnoticed.</text></svg>