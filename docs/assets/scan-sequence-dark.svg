<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 580" width="1180" height="580" role="img" aria-label="The scan timer starts security-monitor, which runs freshclam with the service paused, upgrades packages, runs clamscan and reads its exit code, writes status.json, sends the findings to ALERT_COMMAND only if files were infected, and prunes old scan logs."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6b7684"/></marker></defs><rect x="26.0" y="26" width="196" height="44" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(42.0,38.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M12 7v5l3 2"/></g><text x="73.0" y="53.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600">Scan timer</text><line x1="124" y1="70" x2="124" y2="512" stroke="#30363d" stroke-width="1" stroke-dasharray="4 5"/><rect x="256.0" y="26" width="196" height="44" rx="10" fill="#4c7ef3" stroke="#4c7ef3" stroke-width="1"/><g transform="translate(272.0,38.0) scale(0.8750)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z M8.5 12l2.5 2.5 4.5-4.5"/></g><text x="303.0" y="53.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#ffffff" text-anchor="start" font-weight="600">security-monitor</text><line x1="354" y1="70" x2="354" y2="512" stroke="#30363d" stroke-width="1" stroke-dasharray="4 5"/><rect x="496.0" y="26" width="196" height="44" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(512.0,38.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7a3 3 0 0 1 6 0 M7 9h10v5a5 5 0 0 1-10 0z M12 9v10 M3 12h4 M17 12h4 M4 7l3 2.5 M20 7l-3 2.5 M4 19l3-2.5 M20 19l-3-2.5"/></g><text x="543.0" y="53.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600">ClamAV</text><line x1="594" y1="70" x2="594" y2="512" stroke="#30363d" stroke-width="1" stroke-dasharray="4 5"/><rect x="732.0" y="26" width="196" height="44" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(748.0,38.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5l8 4.5 8-4.5 M12 12v9"/></g><text x="779.0" y="53.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600">apt / dnf</text><line x1="830" y1="70" x2="830" y2="512" stroke="#30363d" stroke-width="1" stroke-dasharray="4 5"/><rect x="954.0" y="26" width="196" height="44" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(970.0,38.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z M10 21h4"/></g><text x="1001.0" y="53.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600">ALERT_COMMAND</text><line x1="1052" y1="70" x2="1052" y2="512" stroke="#30363d" stroke-width="1" stroke-dasharray="4 5"/><rect x="164" y="366" width="984" height="76" rx="8" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="5 4"/><text x="178.0" y="384.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9aa4b0" text-anchor="start" font-weight="600">if infected files were found</text><polyline points="132,104 346,104" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="239.0" y="95.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">scan $SCAN_MODE</text><polyline points="362,144 586,144" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="474.0" y="135.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">freshclam, service paused</text><polyline points="362,184 822,184" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="712.1" y="175.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">upgrade what is pending</text><polyline points="822,218 362,218" fill="none" stroke="#6b7684" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="712.1" y="209.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#aeb7c2" text-anchor="middle">applied, still available</text><polyline points="362,258 586,258" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="474.0" y="249.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">clamscan -r -i --move</text><polyline points="586,292 362,292" fill="none" stroke="#6b7684" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="474.0" y="283.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#aeb7c2" text-anchor="middle">exit 0 clean, 1 infected, 2+ error</text><polyline points="354,322 408,322 408,348 360,348" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="420.0" y="326.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="start">write status.json</text><polyline points="362,420 1044,420" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="703.0" y="411.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#aeb7c2" text-anchor="middle">subject and findings on stdin</text><polyline points="354,466 408,466 408,492 360,492" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="420.0" y="470.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="start">prune old scan logs</text><line x1="24" y1="528" x2="1156" y2="528" stroke="#232a33" stroke-width="1"/><text x="24.0" y="554.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">A dashed arrow is a reply. The result is written before the alert is sent, so the dashboard is current even when the alert command fails.</text></svg>